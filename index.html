<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>StylePick - 쇼핑몰 스타일 프리뷰</title>
  
  <meta name="theme-color" content="#14532d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StylePick">
  <meta name="description" content="쇼핑몰 스타일 프리뷰 클라이언트 PWA 앱">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --color-primary: #14532d;       /* Forest Green */
      --color-accent: #aff33e;        /* Lime */
      --color-text: #1e293b;          /* Slate 800 */
      --color-text-sub: #64748b;      /* Slate 500 */
      --color-danger: #991b1b;        /* Crimson Red */
      --color-naver: #03c75a;         /* Naver Green */
      --color-bg: #f8fafc;            /* Slate 50 */
      --color-card-bg: #ffffff;
      --color-border: #e2e8f0;
      --font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--color-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 24px rgba(30, 41, 59, 0.08);
    }

    header.app-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: #ffffff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-border);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon-wrap {
      background-color: var(--color-accent);
      color: var(--color-primary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .status-banner {
      padding: 12px 18px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-count-wrap {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-new-count {
      background-color: var(--color-danger);
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
    }

    main.content-area {
      flex: 1;
      padding-bottom: 90px;
    }

    /* Mall Card */
    .mall-card {
      background: var(--color-card-bg);
      margin: 10px 16px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--color-border);
      box-shadow: 0 2px 8px rgba(30, 41, 59, 0.04);
      position: relative;
    }

    .mall-card.has-new {
      border: 1.5px solid rgba(153, 27, 27, 0.4);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
      cursor: pointer;
    }

    .badge-new {
      background-color: var(--color-danger);
      color: white;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .mall-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mall-url {
      font-size: 11px;
      color: var(--color-text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .btn-action-icon {
      background: none;
      border: none;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: var(--color-text-sub);
      transition: background-color 0.15s, color 0.15s;
    }

    .btn-action-icon:hover {
      background-color: #f1f5f9;
      color: var(--color-text);
    }

    .btn-action-icon.delete:hover {
      color: var(--color-danger);
    }

    /* Thumbnails 4 Grid */
    .thumbnails-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .thumb-item {
      aspect-ratio: 1 / 1;
      background-color: #f1f5f9;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Card Bottom: Edit Button */
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-top: 1px solid #f1f5f9;
      padding-top: 8px;
    }

    .btn-edit {
      background: none;
      border: 1px solid #cbd5e1;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .btn-edit:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
      color: var(--color-text);
    }

    /* FAB */
    .fab-add {
      position: fixed;
      bottom: 24px;
      right: calc(50% - 240px + 16px);
      background-color: var(--color-naver);
      color: white;
      border: none;
      border-radius: 28px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(3, 199, 90, 0.35);
      cursor: pointer;
      z-index: 50;
    }

    @media (max-width: 480px) {
      .fab-add {
        right: 16px;
      }
    }

    /* Modal Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 16px 20px 28px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 2px;
      margin: 0 auto 12px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--color-text);
    }

    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: var(--color-primary);
    }

    .btn-dialog-submit {
      background-color: var(--color-naver);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-bar">
      <div class="brand-title">
        <div class="brand-icon-wrap"><i data-lucide="shirt" style="width: 18px; height: 18px;"></i></div>
        <div><span class="brand-text">StylePick</span></div>
      </div>
    </header>

    <div class="status-banner">
      <div class="status-count-wrap">
        <span>저장된 쇼핑몰 <span id="txtMallCount">0</span>개</span>
        <span class="badge-new-count" id="badgeNewCount" style="display: none;">신상품 +0</span>
      </div>
    </div>

    <main class="content-area" id="mallListContainer"></main>

    <button class="fab-add" id="btnFabAdd">
      <i data-lucide="plus" style="width: 18px; height: 18px;"></i>
      쇼핑몰 추가
    </button>
  </div>

  <!-- Add Modal -->
  <div class="modal-overlay" id="addMallModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3 style="font-size: 17px; font-weight: 700;">쇼핑몰 링크 추가</h3>
        <button style="background:none; border:none; cursor:pointer;" id="btnCloseAddModal"><i data-lucide="x"></i></button>
      </div>
      <form id="formAddMall">
        <div class="form-group">
          <label>쇼핑몰 웹사이트 주소</label>
          <input type="text" id="inputMallUrl" class="form-control" placeholder="예: https://..." required>
        </div>
        <button type="submit" class="btn-dialog-submit" id="btnSubmitAdd">추가 및 스타일 분석</button>
      </form>
    </div>
  </div>

  <!-- Edit Modal (제목 및 링크 수정) -->
  <div class="modal-overlay" id="editMallModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3 style="font-size: 17px; font-weight: 700;">쇼핑몰 정보 수정</h3>
        <button style="background:none; border:none; cursor:pointer;" id="btnCloseEditModal"><i data-lucide="x"></i></button>
      </div>
      <form id="formEditMall">
        <input type="hidden" id="editMallIdx">
        <div class="form-group">
          <label>쇼핑몰 이름 (표시 제목)</label>
          <input type="text" id="editMallTitle" class="form-control" required>
        </div>
        <div class="form-group">
          <label>쇼핑몰 링크 (URL)</label>
          <input type="text" id="editMallUrl" class="form-control" required>
        </div>
        <button type="submit" class="btn-dialog-submit" id="btnSubmitEdit">수정사항 저장</button>
      </form>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://stylepick-scraper.yersinia-j.workers.dev";
    const STORAGE_KEY = 'stylepick_malls_worker_v1';

    let malls = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    function saveMalls() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(malls));
      renderApp();
    }

    // Worker를 통한 쇼핑몰 데이터 스크래핑
    async function scrapeShop(targetUrl) {
      let cleanUrl = targetUrl.trim();
      if (!cleanUrl.startsWith('http')) cleanUrl = 'https://' + cleanUrl;

      try {
        const res = await fetch(`${WORKER_URL}?url=${encodeURIComponent(cleanUrl)}`);
        if (!res.ok) throw new Error("Scrape failed");
        return await res.json();
      } catch (e) {
        console.error("Worker fetch failed:", e);
        return { 
          title: new URL(cleanUrl).hostname.replace('www.', ''), 
          imageUrls: [] 
        };
      }
    }

    // 네이버 앱 딥링크 호출
    function openNaver(url, id) {
      if (id) {
        const target = malls.find(m => m.id === id);
        if (target && target.hasNew) {
          target.hasNew = false;
          saveMalls();
        }
      }
      const clean = url.trim().startsWith('http') ? url.trim() : `https://${url.trim()}`;
      const scheme = `naversearchapp://inappbrowser?url=${encodeURIComponent(clean)}&target=new&version=6`;
      
      const start = Date.now();
      window.location.href = scheme;
      setTimeout(() => {
        if (Date.now() - start < 1800) window.location.href = clean;
      }, 1000);
    }

    // 개별 쇼핑몰 새로고침 기능
    async function refreshMall(idx) {
      const mall = malls[idx];
      if (!mall || mall.isRefreshing) return;

      mall.isRefreshing = true;
      renderApp();

      try {
        const data = await scrapeShop(mall.url);
        if (data.imageUrls && data.imageUrls.length > 0) {
          // 기존 첫 번째 이미지와 달라졌는지 확인
          if (mall.imageUrls && mall.imageUrls[0] && mall.imageUrls[0] !== data.imageUrls[0]) {
            mall.hasNew = true;
          }
          mall.imageUrls = data.imageUrls;
          if (data.title && (!mall.title || mall.title.includes('.'))) {
            mall.title = data.title;
          }
        }
      } catch (e) {
        console.error("Refresh failed:", e);
      } finally {
        mall.isRefreshing = false;
        saveMalls();
      }
    }

    // 개별 쇼핑몰 삭제 기능
    function deleteMall(idx) {
      if (!confirm("해당 쇼핑몰을 목록에서 삭제하시겠습니까?")) return;
      malls.splice(idx, 1);
      saveMalls();
    }

    // Edit 모달 열기
    function openEditModal(idx) {
      const mall = malls[idx];
      if (!mall) return;

      document.getElementById('editMallIdx').value = idx;
      document.getElementById('editMallTitle').value = mall.title;
      document.getElementById('editMallUrl').value = mall.url;
      document.getElementById('editMallModal').classList.add('active');
    }

    function renderApp() {
      document.getElementById('txtMallCount').textContent = malls.length;
      const badgeNewCountEl = document.getElementById('badgeNewCount');
      const newCount = malls.filter(m => m.hasNew).length;

      if (newCount > 0) {
        badgeNewCountEl.style.display = 'inline-block';
        badgeNewCountEl.textContent = `신상품 +${newCount}`;
      } else {
        badgeNewCountEl.style.display = 'none';
      }

      const container = document.getElementById('mallListContainer');

      if (malls.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 60px 20px; color:#94a3b8; font-size: 14px;">저장된 쇼핑몰이 없습니다.<br>우측 하단 버튼을 눌러 추가해보세요.</div>';
        return;
      }

      container.innerHTML = malls.map((m, idx) => `
        <div class="mall-card ${m.hasNew ? 'has-new' : ''}">
          <!-- 상단: 이름, 배지, 새로고침 및 삭제 아이콘 -->
          <div class="card-header">
            <div class="card-info" onclick="openNaver('${m.url}', '${m.id}')">
              ${m.hasNew ? '<span class="badge-new">NEW</span>' : ''}
              <div style="overflow:hidden;">
                <div class="mall-title">${m.title}</div>
                <div class="mall-url">${m.url}</div>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn-action-icon" title="새로고침" onclick="refreshMall(${idx})">
                <i data-lucide="${m.isRefreshing ? 'loader-2' : 'rotate-cw'}" class="${m.isRefreshing ? 'spin' : ''}" style="width:16px;height:16px;"></i>
              </button>
              <button class="btn-action-icon delete" title="삭제" onclick="deleteMall(${idx})">
                <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
              </button>
            </div>
          </div>

          <!-- 중앙: 4개 썸네일 그리드 (터치 시 네이버 앱 이동) -->
          <div class="thumbnails-grid" onclick="openNaver('${m.url}', '${m.id}')">
            ${(m.imageUrls && m.imageUrls.length > 0)
              ? m.imageUrls.map(img => `
                  <div class="thumb-item">
                    <img src="${img}" referrerpolicy="no-referrer" loading="lazy" onerror="this.src='https://placehold.co/150x150?text=No+Image'">
                  </div>
                `).join('')
              : '<div style="grid-column: span 4; text-align:center; padding: 20px; font-size:12px; color:#94a3b8; background:#f8fafc; border-radius:8px;">이미지를 불러오지 못했습니다. 터치하여 방문</div>'
            }
          </div>

          <!-- 하단: Edit 버튼 -->
          <div class="card-bottom">
            <button class="btn-edit" onclick="openEditModal(${idx})">
              <i data-lucide="pencil" style="width:12px;height:12px;"></i> Edit
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // Modal Control Events
    document.getElementById('btnFabAdd').onclick = () => {
      document.getElementById('addMallModal').classList.add('active');
    };
    document.getElementById('btnCloseAddModal').onclick = () => {
      document.getElementById('addMallModal').classList.remove('active');
    };
    document.getElementById('btnCloseEditModal').onclick = () => {
      document.getElementById('editMallModal').classList.remove('active');
    };

    // 추가 폼 서밋
    document.getElementById('formAddMall').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('inputMallUrl');
      const submitBtn = document.getElementById('btnSubmitAdd');
      const url = input.value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = '분석 중...';

      const data = await scrapeShop(url);
      malls.unshift({
        id: 'mall_' + Date.now(),
        title: data.title,
        url: url,
        imageUrls: data.imageUrls || [],
        hasNew: true
      });

      saveMalls();
      submitBtn.disabled = false;
      submitBtn.textContent = '추가 및 스타일 분석';
      document.getElementById('addMallModal').classList.remove('active');
      input.value = '';
    };

    // 수정 폼 서밋
    document.getElementById('formEditMall').onsubmit = async (e) => {
      e.preventDefault();
      const idx = parseInt(document.getElementById('editMallIdx').value, 10);
      const newTitle = document.getElementById('editMallTitle').value.trim();
      const newUrl = document.getElementById('editMallUrl').value.trim();
      const submitBtn = document.getElementById('btnSubmitEdit');

      if (isNaN(idx) || !malls[idx]) return;

      const mall = malls[idx];
      const isUrlChanged = (mall.url !== newUrl);

      mall.title = newTitle;
      mall.url = newUrl;

      // 링크 URL이 변경된 경우 새로운 이미지로 다시 스크래핑
      if (isUrlChanged) {
        submitBtn.disabled = true;
        submitBtn.textContent = '새 주소 분석 중...';
        const data = await scrapeShop(newUrl);
        if (data.imageUrls && data.imageUrls.length > 0) {
          mall.imageUrls = data.imageUrls;
        }
        submitBtn.disabled = false;
        submitBtn.textContent = '수정사항 저장';
      }

      saveMalls();
      document.getElementById('editMallModal').classList.remove('active');
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
