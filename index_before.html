<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스타일 픽</title>
  
  <!-- 모바일 홈 화면 앱 설정 (PWA / Standalone) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081986.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #1a1a1a; padding-bottom: 40px; }
    
    /* 상단 바 */
    header { position: sticky; top: 0; background: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #eee; z-index: 10; }
    header h1 { font-size: 18px; font-weight: 700; }
    header button { background: #111; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }

    /* 쇼핑몰 리스트 */
    main { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
    .empty-state { text-align: center; color: #888; font-size: 14px; margin-top: 60px; line-height: 1.6; }

    /* 쇼핑몰 카드 */
    .card { background: #fff; border-radius: 14px; padding: 14px; border: 1px solid #ebebeb; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-title-group { display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .card-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .badge-new { background: #ff3b30; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .btn-preview { background: none; border: none; color: #007aff; font-size: 13px; font-weight: 500; cursor: pointer; padding: 4px; }

    /* 4장 썸네일 그리드 */
    .image-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; cursor: pointer; }
    .image-box { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: #f0f0f0; }
    .image-box img { width: 100%; height: 100%; object-fit: cover; }
    .no-images { grid-column: span 4; padding: 20px; text-align: center; font-size: 12px; color: #aaa; background: #fafafa; border-radius: 8px; }

    /* 프리뷰 팝업 모달 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #fff; width: 100%; max-width: 360px; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #eee; }
    .modal-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; aspect-ratio: 3 / 4; background: #000; }
    .modal-slider img { width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; scroll-snap-align: start; }
    .modal-footer { padding: 14px; }
    .btn-naver { width: 100%; background: #03c75a; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>내 쇼핑몰 스타일 픽</h1>
    <button onclick="promptAddShop()">+ 링크 추가</button>
  </header>

  <main id="shopList">
    <div class="empty-state">저장된 쇼핑몰이 없습니다.<br>상단 [+ 링크 추가] 버튼을 눌러보세요.</div>
  </main>

  <!-- 프리뷰 모달 -->
  <div id="previewModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size: 16px;">프리뷰</h3>
        <button style="background:none; border:none; font-size:18px; cursor:pointer;" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-slider" id="modalSlider"></div>
      <div class="modal-footer">
        <button class="btn-naver" id="modalNaverBtn">네이버 앱으로 쇼핑몰 열기</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'style_pick_shops';
    let shops = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    // 초기 렌더링 및 백그라운드 갱신
    document.addEventListener('DOMContentLoaded', () => {
      renderShops();
      refreshShopsInBackground();
    });

    function saveShops() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(shops));
      renderShops();
    }

    // 네이버 앱 딥링크 호출 (미설치 시 일반 브라우저)
    function openNaver(url, shopId) {
      if (shopId) clearNewBadge(shopId);
      const clean = url.trim().startsWith('http') ? url.trim() : `https://${url.trim()}`;
      const naverAppUrl = `naversearchapp://inappbrowser?url=${encodeURIComponent(clean)}&target=new&version=6`;
      
      // 모바일 네이버 앱 호출 시도 후  fallback
      const start = Date.now();
      window.location.href = naverAppUrl;
      setTimeout(() => {
        if (Date.now() - start < 1500) {
          window.location.href = clean;
        }
      }, 800);
    }

    function clearNewBadge(id) {
      const target = shops.find(s => s.id === id);
      if (target && target.hasNew) {
        target.hasNew = false;
        saveShops();
      }
    }

    // 쇼핑몰 추가
    async function promptAddShop() {
      const url = prompt('쇼핑몰 링크(URL)를 입력해 주세요:');
      if (!url) return;

      const cleanUrl = url.trim().startsWith('http') ? url.trim() : `https://${url.trim()}`;
      const newShop = {
        id: Date.now().toString(),
        name: new URL(cleanUrl).hostname,
        url: cleanUrl,
        images: [],
        hasNew: false
      };

      shops.unshift(newShop);
      saveShops();

      // 등록 즉시 파싱 수행
      await fetchShopData(newShop);
      saveShops();
    }

    // 웹 스크래핑 (무료 CORS 오픈 프록시 활용)
    async function fetchShopData(shop) {
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(shop.url)}`;
        const res = await fetch(proxyUrl);
        if (!res.ok) return;
        const html = await res.text();
        
        const doc = new DOMParser().parseFromString(html, 'text/html');
        
        // 쇼핑몰 타이틀
        const title = doc.querySelector('title')?.innerText.split(/[-:|]/)[0].trim();
        if (title) shop.name = title;

        // 이미지 4개 추출
        const imgs = Array.from(doc.querySelectorAll('img'));
        const extracted = [];

        for (const img of imgs) {
          let src = img.getAttribute('src') || img.getAttribute('data-src');
          if (!src) continue;
          if (!src.startsWith('http')) src = new URL(src, shop.url).href;

          const lower = src.toLowerCase();
          if (!lower.includes('logo') && !lower.includes('icon') && !lower.includes('banner') && !lower.includes('.gif')) {
            if (!extracted.includes(src)) extracted.push(src);
          }
          if (extracted.length >= 4) break;
        }

        // 신상품 판별
        if (extracted.length > 0) {
          if (shop.images.length > 0 && shop.images[0] !== extracted[0]) {
            shop.hasNew = true;
          }
          shop.images = extracted;
        }
      } catch (e) {
        console.error('파싱 실패:', e);
      }
    }

    // 백그라운드 갱신
    async function refreshShopsInBackground() {
      for (const shop of shops) {
        await fetchShopData(shop);
      }
      saveShops();
    }

    // 메인 화면 렌더링
    function renderShops() {
      const container = document.getElementById('shopList');
      if (shops.length === 0) {
        container.innerHTML = '<div class="empty-state">저장된 쇼핑몰이 없습니다.<br>상단 [+ 링크 추가] 버튼을 눌러보세요.</div>';
        return;
      }

      container.innerHTML = shops.map(shop => `
        <div class="card">
          <div class="card-head">
            <div class="card-title-group">
              <span class="card-title">${shop.name}</span>
              ${shop.hasNew ? '<span class="badge-new">NEW</span>' : ''}
            </div>
            <button class="btn-preview" onclick="openPreview('${shop.id}')">프리뷰</button>
          </div>
          <div class="image-grid" onclick="openNaver('${shop.url}', '${shop.id}')">
            ${shop.images.length > 0 
              ? shop.images.map(img => `
                  <div class="image-box">
                    <img src="${img}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                  </div>
                `).join('')
              : '<div class="no-images">이미지를 불러오는 중이거나 없습니다 (터치 시 방문)</div>'
            }
          </div>
        </div>
      `).join('');
    }

    // 프리뷰 모달 열기
    function openPreview(id) {
      const shop = shops.find(s => s.id === id);
      if (!shop) return;
      clearNewBadge(id);

      document.getElementById('modalTitle').innerText = shop.name;
      const slider = document.getElementById('modalSlider');
      slider.innerHTML = shop.images.map(img => `<img src="${img}">`).join('');
      
      const btn = document.getElementById('modalNaverBtn');
      btn.onclick = () => {
        closeModal();
        openNaver(shop.url, shop.id);
      };

      document.getElementById('previewModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('previewModal').style.display = 'none';
    }
  </script>
</body>
</html>
